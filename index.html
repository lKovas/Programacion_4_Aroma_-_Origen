
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Inicio | Aroma y Origen</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- Estilos del proyecto -->
    <link rel="stylesheet" href="assets/styles/styles.css">
</head>

<body>

    <!-- Menú de navegación -->
    <header id="navbar"></header>

    <!-- Contenido principal -->
    <div id="contenido"></div>

    <!-- Pie de página -->
    <div id="footer"></div>

    <!-- JavaScript de Bootstrap -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Cargar los archivos HTML -->
    <script>
        async function cargarArchivo(id, ruta) {
            try {
                const respuesta = await fetch(ruta);

                if (!respuesta.ok) {
                    throw new Error("Error al cargar " + ruta);
                }

                const contenido = await respuesta.text();

                document.getElementById(id).innerHTML = contenido;

            } catch (error) {
                console.error(error);
                document.getElementById(id).innerHTML =
                    "<p class='text-center p-3'>No se pudo cargar esta sección.</p>";
            }
        }

        async function iniciarPagina() {

            await Promise.all([
                cargarArchivo(
                    "navbar",
                    "views/main/navbar/navbar.html"
                ),

                cargarArchivo(
                    "contenido",
                    "views/main/body/body.html"
                ),

                cargarArchivo(
                    "footer",
                    "views/main/footer/footer.html"
                )
            ]);

        }

        iniciarPagina();
    </script>

</body>
</html>
