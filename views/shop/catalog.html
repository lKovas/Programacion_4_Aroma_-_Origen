<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Catálogo | Aroma y Origen</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
        crossorigin="anonymous">

    <!-- Estilos del proyecto -->
    <link rel="stylesheet" href="../../assets/styles/styles.css">

    <!-- Estilos exclusivos del catálogo -->
    <link rel="stylesheet" href="../../assets/styles/catalogo.css">

</head>

<body>

    <!-- Contenido principal del catálogo -->
    <main class="container my-5">

        <!-- Encabezado del catálogo -->
        <section class="mb-5">

            <div class="row align-items-center g-4">

                <!-- Título y descripción -->
                <div class="col-12 col-lg-7">

                    <h1>Encuentra tu próxima pausa</h1>

                    <p class="lead">
                        Café, té y accesorios para momentos que importan.
                    </p>

                </div>

                <!-- Buscador de productos -->
                <div class="col-12 col-lg-5">

                    <label for="buscarProducto" class="form-label">
                        Buscar productos
                    </label>

                    <input
                        type="search"
                        class="form-control"
                        id="buscarProducto"
                        name="buscarProducto"
                        placeholder="Buscar productos...">

                </div>

            </div>

        </section>

        <!-- Sección de productos -->
        <section id="productos">

            <div class="row g-4">

                <!-- Menú lateral de categorías -->
                <aside class="col-12 col-lg-3">

                    <div class="card">

                        <div class="card-body">

                            <h2 class="h4 mb-4">Categorías</h2>

                            <div class="list-group">

                                <button type="button"
                                    class="list-group-item list-group-item-action active"
                                    data-categoria="todos">
                                    Todos
                                </button>

                                <button type="button"
                                    class="list-group-item list-group-item-action"
                                    data-categoria="cafe">
                                    Café
                                </button>

                                <button type="button"
                                    class="list-group-item list-group-item-action"
                                    data-categoria="te">
                                    Té
                                </button>

                                <button type="button"
                                    class="list-group-item list-group-item-action"
                                    data-categoria="accesorios">
                                    Accesorios
                                </button>

                            </div>

                        </div>

                    </>

                </aside>

                <!-- Área principal de productos -->
                <div class="col-12 col-lg-9">

                    <h2 class="mb-3">Nuestros productos</h2>

                    <p>
                        Descubre nuestra selección de café, té y accesorios.
                    </p>

                    <!-- Contenedor para las tarjetas de productos -->
                    <div class="row g-4" id="listaProductos">

                        <!-- Las tarjetas se generan automáticamente con JavaScript -->

                    </div>

                </div>

            </div>

        </section>

    </main>

    <!-- JavaScript de Bootstrap -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous">
    </script>

    <!-- Datos compartidos de productos -->
    <script src="../../assets/js/productos.js"></script>

    <!-- Funciones del catálogo -->
    <script src="../../assets/js/catalogo.js"></script>

</body>

</html>
