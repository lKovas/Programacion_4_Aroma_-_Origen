 <!-- Contenido principal del catálogo -->
    <main class="container my-5">

        <!-- Encabezado del catálogo -->
        <section class="mb-5">

            <div class="row align-items-center g-4">

                <!-- Título y descripción -->
                <div class="col-12 col-lg-7">

                    <h1>Encuentra tu próxima pausa</h1>

                    <p class="lead">
                        Café, té y accesorios para momentos que importan.
                    </p>

                </div>

                <!-- Buscador de productos -->
                <div class="col-12 col-lg-5">

                    <label for="buscarProducto" class="form-label">
                        Buscar productos
                    </label>

                    <input
                        type="search"
                        class="form-control"
                        id="buscarProducto"
                        name="buscarProducto"
                        placeholder="Buscar productos...">

                </div>

            </div>

        </section>

        <!-- Sección de productos -->
        <section id="productos">

            <div class="row g-4">

                <!-- Menú lateral de categorías -->
                <aside class="col-12 col-lg-3">

                    <div class="card">

                        <div class="card-body">

                            <h2 class="h4 mb-4">Categorías</h2>

                            <div class="list-group">

                                <button type="button"
                                    class="list-group-item list-group-item-action active"
                                    data-categoria="todos">
                                    Todos
                                </button>

                                <button type="button"
                                    class="list-group-item list-group-item-action"
                                    data-categoria="cafe">
                                    Café
                                </button>

                                <button type="button"
                                    class="list-group-item list-group-item-action"
                                    data-categoria="te">
                                    Té
                                </button>

                                <button type="button"
                                    class="list-group-item list-group-item-action"
                                    data-categoria="accesorios">
                                    Accesorios
                                </button>

                            </div>

                        </div>

                    </div>

                </aside>

                <!-- Área principal de productos -->
                <div class="col-12 col-lg-9">

                    <h2 class="mb-3">Nuestros productos</h2>

                    <p>
                        Descubre nuestra selección de café, té y accesorios.
                    </p>

                    <!-- Contenedor para las tarjetas de productos -->
                    <div class="row g-4" id="listaProductos">

                        <!-- Las tarjetas se generan automáticamente con JavaScript -->

                    </div>

                </div>

            </div>

        </section>

    </main>
